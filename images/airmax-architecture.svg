<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 45 2040 925" width="2040" height="925" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <style>
      .tileLabel { font-size: 21px; font-weight: 700; fill: #232f3e; text-anchor: middle; }
      .tileSub   { font-size: 17px; fill: #5a6572; text-anchor: middle; }
      .zoneLabel { font-size: 22px; font-weight: 700; fill: #4a5568; }
      .chip      { font-size: 15px; fill: #3d4852; text-anchor: middle; }
      .glyph     { fill: #ffffff; }
      .note      { font-size: 16px; fill: #8a94a0; text-anchor: middle; font-style: italic; }
      .flow      { stroke: #4a5568; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .flowDash  { stroke: #4a5568; stroke-width: 2.6; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="40" y="45" width="2040" height="925" fill="#ffffff"/>

  <!-- AWS account -->
  <rect x="300" y="62" width="1460" height="888" fill="none" stroke="#5a6572" stroke-width="2.5"/>
  <rect x="325" y="78" width="52" height="52" rx="10" fill="#ED7100"/>
  <text x="351" y="112" class="glyph" font-size="20" font-weight="700" text-anchor="middle">aws</text>
  <text x="396" y="114" font-size="25" font-weight="700" fill="#232f3e">AWS Account — AirMax</text>

  <!-- ===== Source (outside our account) ===== -->
  <rect x="133" y="232" width="84" height="84" rx="16" fill="#E7157B"/>
  <g class="glyph" transform="translate(175,274)">
    <circle cx="-16" cy="0" r="7"/><circle cx="14" cy="-16" r="6"/><circle cx="14" cy="16" r="6"/>
    <path d="M -10 -3 L 9 -14 M -10 3 L 9 14" stroke="#ffffff" stroke-width="3" fill="none"/>
  </g>
  <text x="175" y="348" class="tileLabel">OpenAQ SNS topic</text>

  <path class="flow" d="M 221 274 H 508"/>
  <rect x="308" y="258" width="112" height="28" rx="5" fill="#ffffff" stroke="#cfd6de"/>
  <text x="364" y="277" class="chip">publishes</text>

  <!-- Zones -->
  <rect x="330" y="140" width="450" height="800" rx="10" fill="#eaf3e6" stroke="#b9d3ad" stroke-width="2"/>
  <text x="356" y="180" class="zoneLabel">Raw zone</text>
  <rect x="800" y="140" width="490" height="800" rx="10" fill="#e8eefa" stroke="#b6c6e6" stroke-width="2"/>
  <text x="826" y="180" class="zoneLabel">Transformation zone</text>
  <rect x="1310" y="140" width="430" height="800" rx="10" fill="#faeee2" stroke="#e6cbaa" stroke-width="2"/>
  <text x="1336" y="180" class="zoneLabel">Serving zone</text>

  <!-- ===== RAW ZONE ===== -->
  <!-- SQS -->
  <rect x="513" y="232" width="84" height="84" rx="16" fill="#E7157B"/>
  <g class="glyph" transform="translate(555,274)">
    <rect x="-22" y="-16" width="44" height="32" rx="5" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M -22 -10 H 22 M -22 -2 H 22 M -22 6 H 22" stroke="#ffffff" stroke-width="2.4"/>
  </g>
  <text x="555" y="348" class="tileLabel">SQS</text>
  <text x="555" y="372" class="tileSub">our queue on the</text>
  <text x="555" y="394" class="tileSub">OpenAQ topic</text>

  <path class="flow" d="M 555 410 V 468"/>
  <rect x="566" y="425" width="176" height="28" rx="5" fill="#ffffff" stroke="#cfd6de"/>
  <text x="654" y="444" class="chip">event source mapping</text>

  <!-- Ingestion Lambda -->
  <rect x="513" y="472" width="84" height="84" rx="16" fill="#ED7100"/>
  <text x="555" y="530" class="glyph" font-size="52" font-weight="600" text-anchor="middle">λ</text>
  <text x="555" y="588" class="tileLabel">Ingestion Lambda</text>
  <text x="555" y="612" class="tileSub">writes records untouched,</text>
  <text x="555" y="634" class="tileSub">partitioned by SNS publish hour</text>

  <path class="flow" d="M 555 650 V 706"/>
  <rect x="566" y="664" width="74" height="28" rx="5" fill="#ffffff" stroke="#cfd6de"/>
  <text x="603" y="683" class="chip">writes</text>

  <!-- S3 raw -->
  <rect x="513" y="710" width="84" height="84" rx="16" fill="#3F8624"/>
  <g class="glyph" transform="translate(555,752)">
    <path d="M -21 -16 H 21 L 16 18 H -16 Z" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M -14 -6 C -2 6, 6 8, 16 4" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
  <text x="555" y="826" class="tileLabel">S3 — raw bucket</text>
  <text x="555" y="852" class="tileSub">raw/YYYY/MM/DD/HH/</text>
  <text x="555" y="876" class="tileSub">raw/invalid/YYYY/MM/DD/HH/</text>
  <text x="555" y="906" class="note">nothing is cleaned here — replayable</text>

  <!-- ===== TRANSFORMATION ZONE ===== -->
  <!-- EventBridge -->
  <rect x="1003" y="232" width="84" height="84" rx="16" fill="#E7157B"/>
  <g class="glyph" transform="translate(1045,274)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M 0 -11 V 1 L 9 7" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="1045" y="348" class="tileLabel">EventBridge Rule</text>
  <text x="1045" y="372" class="tileSub">every 5 minutes</text>

  <path class="flowDash" d="M 1045 410 V 468"/>
  <rect x="1056" y="425" width="76" height="28" rx="5" fill="#ffffff" stroke="#cfd6de"/>
  <text x="1094" y="444" class="chip">trigger</text>

  <!-- read arrow from raw bucket -->
  <path class="flow" d="M 601 752 H 700 V 514 H 999"/>
  <rect x="725" y="500" width="250" height="28" rx="5" fill="#ffffff" stroke="#cfd6de"/>
  <text x="850" y="519" class="chip">reads window + 1 boundary hour</text>

  <!-- Transformation Lambda -->
  <rect x="1003" y="472" width="84" height="84" rx="16" fill="#ED7100"/>
  <text x="1045" y="530" class="glyph" font-size="52" font-weight="600" text-anchor="middle">λ</text>
  <text x="1045" y="588" class="tileLabel">Transformation Lambda</text>
  <text x="1045" y="612" class="tileSub">validate → 3h window → dedupe →</text>
  <text x="1045" y="634" class="tileSub">municipality → aggregate</text>
  <text x="1045" y="660" class="note">skips if selected input unchanged</text>

  <path class="flow" d="M 1045 676 V 706"/>
  <rect x="1056" y="672" width="74" height="28" rx="5" fill="#ffffff" stroke="#cfd6de"/>
  <text x="1093" y="691" class="chip">writes</text>

  <!-- S3 results -->
  <rect x="1003" y="710" width="84" height="84" rx="16" fill="#3F8624"/>
  <g class="glyph" transform="translate(1045,752)">
    <path d="M -21 -16 H 21 L 16 18 H -16 Z" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M -14 -6 C -2 6, 6 8, 16 4" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
  <text x="1045" y="826" class="tileLabel">S3 — results bucket</text>
  <text x="1045" y="852" class="tileSub">results/latest.json</text>
  <text x="1045" y="890" class="note">recomputed from raw, never incremented</text>

  <!-- ===== SERVING ZONE ===== -->
  <path class="flow" d="M 1091 752 H 1190 V 514 H 1479"/>
  <rect x="1249" y="500" width="170" height="28" rx="5" fill="#ffffff" stroke="#cfd6de"/>
  <text x="1334" y="519" class="chip">reads latest.json</text>

  <rect x="1483" y="472" width="84" height="84" rx="16" fill="#ED7100"/>
  <text x="1525" y="530" class="glyph" font-size="52" font-weight="600" text-anchor="middle">λ</text>
  <text x="1525" y="588" class="tileLabel">Website Lambda</text>
  <text x="1525" y="612" class="tileSub">Function URL (HTTPS)</text>
  <text x="1525" y="634" class="tileSub">no analytics on the request path</text>

  <path class="flow" d="M 1525 650 V 712"/>
  <rect x="1536" y="666" width="68" height="28" rx="5" fill="#ffffff" stroke="#cfd6de"/>
  <text x="1570" y="685" class="chip">serves</text>

  <rect x="1455" y="716" width="140" height="92" rx="8" fill="none" stroke="#232f3e" stroke-width="3"/>
  <rect x="1500" y="808" width="50" height="9" rx="3" fill="#232f3e"/>
  <text x="1525" y="846" class="tileLabel">Map</text>
  <text x="1525" y="872" class="tileSub">municipality averages,</text>
  <text x="1525" y="894" class="tileSub">measurement + location counts</text>

  <path class="flow" d="M 1599 762 H 1786"/>
  <rect x="1633" y="748" width="120" height="28" rx="5" fill="#ffffff" stroke="#cfd6de"/>
  <text x="1693" y="767" class="chip">opens the map</text>

  <!-- Stakeholders -->
  <rect x="1790" y="660" width="270" height="200" fill="none" stroke="#9aa3ad" stroke-width="2"/>
  <text x="1816" y="700" font-size="20" font-weight="700" fill="#232f3e">Stakeholders</text>
  <g transform="translate(1925,762)" fill="none" stroke="#232f3e" stroke-width="3">
    <circle cx="-34" cy="-10" r="12"/><path d="M -54 24 a 20 20 0 0 1 40 0"/>
    <circle cx="34" cy="-10" r="12"/><path d="M 14 24 a 20 20 0 0 1 40 0"/>
    <circle cx="0" cy="-18" r="15"/><path d="M -25 28 a 25 25 0 0 1 50 0"/>
  </g>
  <text x="1925" y="826" class="tileLabel">AirMax sales</text>
  <text x="1925" y="850" class="tileSub">and Belgian cities</text>
</svg>
