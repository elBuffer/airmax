[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airmax-ingestion"
version = "0.1.0"
description = "Stores incoming OpenAQ messages unchanged in S3 raw/."
requires-python = ">=3.11"
dependencies = ["boto3==1.40.30"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["airmax_ingestion*"]

[tool.setuptools.package-data]
airmax_ingestion = []
