[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airmax-transformation"
version = "0.1.0"
description = "Streams raw readings into results/latest.json."
requires-python = ">=3.11"
dependencies = ["boto3==1.40.30", "botocore==1.40.76", "shapely==2.1.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["airmax_transformation*"]

[tool.setuptools.package-data]
airmax_transformation = ["reference/*.geojson"]
